  <rect x="380" y="330" width="440" height="300" rx="14" fill="#c7d2e1" stroke="#7f97b8" stroke-width="6"/>
  <circle cx="600" cy="480" r="110" fill="none" stroke="#7f97b8" stroke-width="10"/>
  <g stroke="#7f97b8" stroke-width="8" stroke-linecap="round">
