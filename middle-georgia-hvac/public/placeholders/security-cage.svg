<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Placeholder: photo of an iron security cage over an outdoor AC unit">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6dfeb"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#sky)"/>
  <rect y="640" width="1200" height="260" fill="#aebfd6"/>
  <!-- slab -->
  <rect x="300" y="610" width="600" height="60" rx="6" fill="#7f97b8"/>
